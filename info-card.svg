<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 366" width="490" height="366"><style>.r{opacity:0;animation:slide .5s ease forwards}@keyframes slide{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}</style><rect x="0.5" y="0.5" width="489" height="365" rx="10" fill="#0d1117" stroke="#30363d"/><text x="24" y="28" fill="#7ee787" font-weight="bold" font-family="monospace" font-size="14">mysticalmayfly@github</text><line x1="24" y1="42" x2="466" y2="42" stroke="#30363d"/><g class="r" style="animation-delay:0.30s"><text x="24" y="80" fill="#c9d1d9" font-family="monospace" font-size="13">I build stuff just for fun.</text></g><g class="r" style="animation-delay:0.55s"><text x="24" y="108" fill="#c9d1d9" font-family="monospace" font-size="13">I vibe code, so I use whatever Claude uses.</text></g><g class="r" style="animation-delay:0.80s"><text x="24" y="136" fill="#c9d1d9" font-family="monospace" font-size="13">Not the lazy kind, though. Lately I'm deep</text></g><g class="r" style="animation-delay:1.05s"><text x="24" y="164" fill="#c9d1d9" font-family="monospace" font-size="13">into how real production pipelines work:</text></g><g class="r" style="animation-delay:1.30s"><text x="26" y="192" fill="#ff7b72" font-weight="bold" font-family="monospace" font-size="13">›</text><text x="44" y="192" fill="#c9d1d9" font-family="monospace" font-size="13">Git branches and pull requests</text></g><g class="r" style="animation-delay:1.55s"><text x="26" y="220" fill="#ff7b72" font-weight="bold" font-family="monospace" font-size="13">›</text><text x="44" y="220" fill="#c9d1d9" font-family="monospace" font-size="13">Databases, Supabase auth and OAuth</text></g><g class="r" style="animation-delay:1.80s"><text x="26" y="248" fill="#ff7b72" font-weight="bold" font-family="monospace" font-size="13">›</text><text x="44" y="248" fill="#c9d1d9" font-family="monospace" font-size="13">CD pipeline with Netlify</text></g><g class="r" style="animation-delay:2.05s"><text x="26" y="276" fill="#ff7b72" font-weight="bold" font-family="monospace" font-size="13">›</text><text x="44" y="276" fill="#c9d1d9" font-family="monospace" font-size="13">GitHub Actions that keep this page updated</text></g><g class="r" style="animation-delay:2.30s"><text x="24" y="304" fill="#c9d1d9" font-family="monospace" font-size="13">That's about it.</text></g><rect x="24" y="332" width="40" height="10" rx="3" fill="#7c5cff"/><rect x="70" y="332" width="40" height="10" rx="3" fill="#ff7a3d"/><rect x="116" y="332" width="40" height="10" rx="3" fill="#ffa62b"/><rect x="162" y="332" width="40" height="10" rx="3" fill="#00c2a0"/><rect x="208" y="332" width="40" height="10" rx="3" fill="#3d8bff"/><rect x="254" y="332" width="40" height="10" rx="3" fill="#ff4d7d"/><rect x="300" y="332" width="40" height="10" rx="3" fill="#3fbf5f"/></svg>